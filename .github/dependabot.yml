version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:15"
      timezone: "America/New_York"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 3
    groups:
      python:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:30"
      timezone: "America/New_York"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns:
          - "*"
